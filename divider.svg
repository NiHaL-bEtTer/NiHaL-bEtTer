<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="Animated emerald and violet divider">
<title>Animated emerald and violet divider</title>
<defs>
<linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a69cff"/><stop offset="1" stop-color="#4ddfb5"/></linearGradient>
<radialGradient id="violet"><stop stop-color="#7160d7" stop-opacity=".22"/><stop offset="1" stop-color="#7160d7" stop-opacity="0"/></radialGradient>
<radialGradient id="emerald"><stop stop-color="#129b80" stop-opacity=".16"/><stop offset="1" stop-color="#129b80" stop-opacity="0"/></radialGradient>
</defs>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif}.mono{font-family:'DejaVu Sans Mono',monospace}</style>
<path d="M0 12H1000" stroke="#273246"/><path d="M0 12H1000" stroke="url(#accent)" stroke-dasharray="90 910" stroke-width="1.4"><animate attributeName="stroke-dashoffset" values="90;-1000" dur="10s" repeatCount="indefinite"/></path></svg>